<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Been There, Shipped That</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2rem);
      text-align: center;
      margin-bottom: 4px;
      color: #e63946;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      margin-bottom: 16px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: min(98vw, 540px);
    }

    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      font-size: clamp(0.55rem, 2vw, 0.75rem);
      line-height: 1.3;
      cursor: pointer;
      user-select: none;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .cell.free {
      background: #0f3460;
      border-color: #e63946;
      font-weight: bold;
      color: #e63946;
      cursor: default;
    }

    .cell.marked {
      background: #e63946;
      border-color: #c1121f;
      color: #fff;
    }

    .cell.bingo-line {
      background: #2a9d8f;
      border-color: #21867a;
    }

    #banner {
      display: none;
      font-size: clamp(2rem, 10vw, 3.5rem);
      font-weight: 900;
      color: #e63946;
      text-align: center;
      margin-top: 20px;
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0%  { transform: scale(0.5); opacity: 0; }
      100%{ transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Been There, Shipped That</h1>
  <p class="subtitle">Tap a square when you recognise your team. Get 5 in a row — BINGO!</p>
  <div id="grid"></div>
  <div id="banner">🎉 BINGO!</div>
  <script src="bingo.js"></script>
</body>
</html>
